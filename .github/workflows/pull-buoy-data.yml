name: Pull buoy data from Google Sheet

on:
  schedule:
    # Fires at :00, :20, :40 past every hour -- a true 20-minute cadence,
    # which Google Apps Script triggers can't do natively (they're limited
    # to 1/5/10/15/30-minute steps).
    - cron: "*/20 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated JSON file

jobs:
  pull-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install gspread google-auth

      - name: Pull latest sheet data
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/pull_sheet_data.py

      - name: Commit and push if data changed
        run: |
          git config user.name "buoy-data-bot"
          git config user.email "actions@github.com"
          git add data/buoy_track.json
          git diff --quiet --cached || git commit -m "Update buoy track data"
          git push

# test
